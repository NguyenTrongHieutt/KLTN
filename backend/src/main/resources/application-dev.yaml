# AD-25: the dev environment. The first migration stamps platform.environment with this value,
# and the application refuses to start against a database stamped for another environment.
spring:
  flyway:
    # SG-36: dev seed data lives only in db/seed/dev, which only this profile adds; prod refuses it.
    locations: classpath:db/migration,classpath:db/seed/dev
    placeholders:
      environment: dev

vibefix:
  github:
    # AD-25: the dev GitHub organization; the prod profile refuses to start with it.
    organization: vibefix-dev
  email:
    # The dev stack's Mailpit (deploy/compose.yaml sets VIBEFIX_EMAIL_SMTP_HOST=mailpit); its web view
    # is http://127.0.0.1:8025. It needs no credentials and no TLS.
    link-base-url: http://localhost:5173
    smtp:
      host: localhost
      port: 1025
      starttls: false
  sandbox:
    # Dev-first rule: no sandbox worker runs on the dev stack until Story 18.2, so jobs run inside the
    # application (shared.internal.sandbox.InProcessSandboxJobs); prod refuses this.
    in-process: true
  files:
    # deploy/compose.yaml mounts the files volume here; a run outside Docker uses a temporary folder.
    root: ${VIBEFIX_FILES_ROOT:${java.io.tmpdir}/vibefix-files}
