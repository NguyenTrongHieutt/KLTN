# AD-25: the prod environment (the pilot). The first migration stamps platform.environment with
# this value, and the application refuses to start against a database stamped for another environment.
spring:
  flyway:
    placeholders:
      environment: prod

# AD-21: the API document and Swagger UI are not served in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

vibefix:
  github:
    # AD-25: the production GitHub organization. Configuring vibefix-dev here refuses the start (SG-36).
    organization: vibefix-platform
