spring:
  application:
    name: vibefix-app
  main:
    # Conventions, Logging: standard output carries JSON log lines only.
    banner-mode: off
  config:
    # AD-22: credentials are mounted secret files, one file per property name
    # (db-app-password, db-migrator-password). Nothing secret lives in this file.
    import: optional:configtree:${VIBEFIX_SECRETS_DIR:/run/secrets/}
  datasource:
    # The application connects as the runtime role, which has DML only.
    url: jdbc:postgresql://${VIBEFIX_DB_HOST:localhost}:${VIBEFIX_DB_PORT:5432}/vibefix
    username: vibefix_app
    password: ${db-app-password}
  flyway:
    # Migrations run as the migration role, which owns every schema (Conventions, Migrations).
    user: vibefix_migrator
    password: ${db-migrator-password}
    # Flyway history and framework tables live in schema platform (AD-2).
    schemas: platform
    default-schema: platform
    create-schemas: true
    locations: classpath:db/migration
    out-of-order: false
    validate-migration-naming: true
    placeholders:
      # Brackets keep the underscore in the map key.
      "[runtime_role]": ${spring.datasource.username}
      # "environment" is set by the dev and prod profiles (AD-25).
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.jdbc.time_zone]": UTC
  modulith:
    events:
      # AD-9: publications left incomplete (failed, or cut off by a stop) are delivered again at start.
      republish-outstanding-events-on-restart: true
      jdbc:
        # The table is created by Flyway (db/migration/platform), never by the framework.
        schema: platform
        schema-initialization:
          enabled: false
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      # AD-21: an upload is at most 10 MB (files checks the exact size); the request has room for its form.
      max-file-size: 10MB
      max-request-size: 11MB
  # AD-19: sessions live in PostgreSQL (schema platform, created by Flyway, never by the framework);
  # the cookie is identity.internal.SecurityConfiguration#cookieSerializer.
  session:
    timeout: 8h
    jdbc:
      table-name: platform.SPRING_SESSION
      initialize-schema: never

# A slightly larger upload is still read to its end, so its FILE_TOO_LARGE answer reaches the client.
server:
  tomcat:
    max-swallow-size: 16MB

springdoc:
  # Stable key order keeps the committed frontend/src/api/openapi.json diff-free.
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

# Conventions, Logging: one JSON object per line (Elastic Common Schema). Every line written while a
# request is handled carries its correlationId (shared.internal.CorrelationIdFilter). Log no tokens,
# secrets or personal data, and never request headers.
logging:
  structured:
    format:
      console: ecs

# AD-22: Actuator exposes only health. Liveness and readiness are /actuator/health/{liveness,readiness};
# components (db, sandbox, ...) show their status only, never details.
management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: always

vibefix:
  identity:
    # AD-22: the identity-token-key-{n} secret file that seals new tokens; raise it to rotate.
    token-key-version: 1
    # AD-19, AD-22: the identity-person-signal-key-{n} secret file new person-link signals are
    # computed under; earlier versions stay live for lookups until their files are removed.
    person-signal-key-version: 1
    # N-10's current version; the SPA shows the same one (frontend/src/i18n/vi.json notice.privacy.version).
    # 3.0 (Story 19.1): the Google sign-in and roles per Job; a returning account accepts it again on PUB-3.
    privacy-notice-version: "3.0"
    support-email: hotro@vibefix.vn
    # AD-34: sign-in attempts per client address and minute.
    sign-in-limit-per-minute: 20
  # FR-7, AD-34: CUS-3's acknowledgments (N-1, N-1b, N-2) and the daily registration limit.
  product:
    notice-version: "1.0"
    per-day: 5
    # FR-8 seed limit: re-scans and clean-repository candidates per Product per Vietnam day.
    rescans-per-day: 5
  github:
    # GitHub's REST API (AD-10, AD-13); Story 1.14's spike-s1 probe reads repositories from it.
    api-url: https://api.github.com
    # Where repositories are cloned from and pushed to (AD-11). The Apps' IDs and key files
    # (vibefix.github.platform-app.*, merge-app.*) are set where a story needs them; see
    # deploy/README.md "Spike S4".
    git-url: https://github.com
    # AD-12: both Apps' webhooks reach POST /webhooks, signed with each App's secret file
    # (platform-app.webhook-secret-file, merge-app.webhook-secret-file). Set webhook-url to
    # https://<host>/webhooks where it is known, and the daily configuration check compares it.
    # AD-12, SG-18 (Vietnam time): failed deliveries are redelivered, then each App is compared with AD-10.
    redelivery-cron: "0 0 4 * * *"
    configuration-check-cron: "0 10 4 * * *"
    # AD-10: the sign-in OAuth App's endpoints; its client ID and secret are secret files.
    oauth:
      authorization-uri: https://github.com/login/oauth/authorize
      token-uri: https://github.com/login/oauth/access_token
      user-info-uri: https://api.github.com/user
      # FR-48: the primary verified email, where notifications are emailed (scope user:email).
      user-emails-uri: https://api.github.com/user/emails
  google:
    # FR-1, AD-19 (Story 19.1): the Google sign-in client's endpoints (OpenID Connect, scopes openid email
    # profile); its client ID and secret are the secret files google-oauth-client-id and
    # google-oauth-client-secret. The ID token is checked against the issuer and the keys at jwk-set-uri.
    oauth:
      issuer-uri: https://accounts.google.com
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
  repo:
    # AD-11, AD-12: how often the grants still to settle are read back from GitHub (invitations accepted,
    # two-factor authentication, drifted members); a member webhook reads a Job's grants at once.
    grant-sweep: PT10M
    # FR-8, AD-12: how often each Working Repository's branch and tag heads are read back, so a missed
    # push webhook is caught; any new or moved head requests a push scan.
    push-sweep: PT10M
    # FR-19, AD-12: how often the organization, the installation, and every running Job's repositories are
    # read back against what vibefix expects; foreign pull requests are closed on the way.
    platform-sweep: PT10M
    # FR-20, AD-12 (Vietnam time): the daily Source Repository drift poll of every running Code Job.
    drift-cron: "0 0 5 * * *"
  # AD-9: shared.internal.EventPublicationMaintenance resubmits, stalls and purges publications.
  events:
    resubmit-after: 5m
    # Attempts, the first delivery included; then the publication waits in the Administrator queue.
    max-attempts: 5
    purge-after: 30d
    processed-retention: 90d
    maintenance-interval: 1m
  payment:
    # AD-14: the environment's own VNPay sandbox merchant, and only the sandbox (the start is
    # refused otherwise). The terminal code and the hash secret file are set where a story needs
    # them; see deploy/README.md "Spike S2".
    vnpay:
      pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      api-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
    # AD-15 (Spike S2, 2026-10-21): refunds go through VNPay's refund call (vnpay); ledger records them
    # on vibefix only ("Hoàn tiền mô phỏng"), for the tests and as a fallback.
    refund-gateway: vnpay
  timers:
    # AD-7: due Deadlines are claimed every 30 s, at most this many per poll.
    poll-interval: 30s
    batch-size: 100
  # AD-6: the seed operation policy. The pollers claim due operations every poll-interval; each lane
  # runs at most concurrency attempts at once, each leased for its timeout.
  operations:
    poll-interval: 30s
    lanes:
      github-long:
        concurrency: 1
        timeout: 15m
      github-short:
        concurrency: 4
        timeout: 30s
      scan:
        concurrency: 2
        # The scan job stops itself after 10 minutes (Seed limits); the lease covers recording it too.
        timeout: 12m
      email:
        concurrency: 2
        # Longer than a slow SMTP exchange (a 10 s connect, then several replies of up to 30 s each),
        # so a lease never expires while a message is still being handed over.
        timeout: 3m
      vnpay:
        concurrency: 2
        timeout: 30s
  # AD-27, AD-34: email over SMTP. The username and password are the secret files smtp-username and
  # smtp-password (AD-22); the provider (Resend or Brevo) is chosen at deployment.
  email:
    from: "vibefix <no-reply@vibefix.vn>"
    # Emails per UTC day: Resend's free tier, the lower of the two providers'.
    daily-budget: 100
    alert-percent: 80
    smtp:
      port: 587
      starttls: true
      connect-timeout: 10s
      timeout: 30s
  # AD-32: the sandbox worker that runs untrusted content (same image, profile sandbox).
  sandbox:
    url: http://sandbox:8080
    timeout: 30s
  # AD-21, AD-34: stored files. The files volume is its own mount, with its own quota.
  files:
    root: /var/lib/vibefix/files
    max-size: 10MB
    uploads-per-hour: 30
