# Spike S6 (revision of 2026-11-10): copies one Handover Commit from a Job's Working Repository to a
# handover/ branch of its Intermediary Repository, inside GitHub Actions of vibefix-dev/vibefix-runner:
# the one repository of vibefix-dev whose Actions may run ("Selected repositories"). The probe
# `spike-s6` (backend, github.internal.SpikeS6Command) writes this file to the runner's
# .github/workflows/, and the Platform App dispatches it.
#
# The run holds no secret. It asks GitHub Actions for an OIDC ID token with the audience vibefix and
# exchanges it at the probe's exchange for a token narrowed to the Working and Intermediary
# Repositories. The probe lends that token only to a run of this exact file (its blob) on main,
# dispatched by the Platform App, and revokes it when the run ends. The ID token and the token are
# masked before anything else runs. Inputs reach the scripts through env: only and are checked first;
# git reads the token from a file through GIT_ASKPASS, never pushes with force, and reads the branch
# back.
name: s6-copy
run-name: s6-copy ${{ inputs.correlation }}

on:
  workflow_dispatch:
    inputs:
      correlation:
        description: The probe's correlation ID for this run
        required: true
        type: string
      exchange_url:
        description: Where the ID token is exchanged, an https origin (Spike S6)
        required: true
        type: string
      source_repository:
        description: owner/name of the repository copied from
        required: true
        type: string
      source_branch:
        description: The branch the commit must be on
        required: true
        type: string
      sha:
        description: The commit copied, 40 hex digits
        required: true
        type: string
      target_repository:
        description: owner/name of the repository copied to
        required: true
        type: string
      target_branch:
        description: The branch the commit is pushed to, without force
        required: true
        type: string

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check the inputs
        env:
          CORRELATION: ${{ inputs.correlation }}
          EXCHANGE_URL: ${{ inputs.exchange_url }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SHA: ${{ inputs.sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          correlation_re='^[a-z0-9][a-z0-9-]{7,63}$'
          url_re='^https://[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?(:[0-9]{1,5})?$'
          repository_re='^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$'
          branch_re='^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'
          sha_re='^[0-9a-f]{40}$'
          [[ "$CORRELATION" =~ $correlation_re ]] || { echo "::error::correlation is not a correlation ID"; exit 1; }
          [[ "$EXCHANGE_URL" =~ $url_re ]] || { echo "::error::exchange_url is not an https origin"; exit 1; }
          for value in "$SOURCE_REPOSITORY" "$TARGET_REPOSITORY"; do
            [[ "$value" =~ $repository_re && "$value" != */. && "$value" != */.. ]] || { echo "::error::a repository is not owner/name"; exit 1; }
          done
          for value in "$SOURCE_BRANCH" "$TARGET_BRANCH"; do
            [[ "$value" =~ $branch_re && "$value" != *..* && "$value" != *//* && "$value" != */ && "$value" != *.lock ]] || { echo "::error::a branch name is refused"; exit 1; }
          done
          [[ "$SHA" =~ $sha_re ]] || { echo "::error::sha is not 40 hex digits"; exit 1; }

      - name: Exchange the ID token
        env:
          CORRELATION: ${{ inputs.correlation }}
          EXCHANGE_URL: ${{ inputs.exchange_url }}
        run: |
          set -euo pipefail
          umask 077
          printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$RUNNER_TEMP/oidc-header"
          id_token="$(curl -sS --fail --max-time 30 -H @"$RUNNER_TEMP/oidc-header" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vibefix" | jq -r '.value // empty')"
          rm -f "$RUNNER_TEMP/oidc-header"
          echo "::add-mask::$id_token"
          [ -n "$id_token" ] || { echo "::error::GitHub gave no ID token"; exit 1; }
          ID_TOKEN="$id_token" jq -n '{id_token: env.ID_TOKEN, correlation: env.CORRELATION}' > "$RUNNER_TEMP/exchange.json"
          unset id_token
          status="$(curl -sS --max-time 60 -o "$RUNNER_TEMP/exchanged.json" -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/exchange.json" "$EXCHANGE_URL/exchange")"
          rm -f "$RUNNER_TEMP/exchange.json"
          if [ "$status" != 200 ]; then
            reason="$(jq -r '.reason // "-"' "$RUNNER_TEMP/exchanged.json" 2>/dev/null || echo -)"
            rm -f "$RUNNER_TEMP/exchanged.json"
            echo "::error::the exchange refused the ID token: HTTP $status $reason"
            exit 1
          fi
          token="$(jq -r '.token // empty' "$RUNNER_TEMP/exchanged.json")"
          rm -f "$RUNNER_TEMP/exchanged.json"
          echo "::add-mask::$token"
          # Installation tokens are opaque: since GitHub's 2026 rollout they read ghs_<App ID>_<JWT>, about
          # 520 characters with dots and dashes. Only characters safe in a file and a header are taken.
          token_re='^[A-Za-z0-9_.-]{20,}$'
          if ! [[ "$token" =~ $token_re ]] || (( ${#token} > 4096 )); then
            echo "::error::the exchange answered no token"
            exit 1
          fi
          printf '%s' "$token" > "$RUNNER_TEMP/vibefix-token"
          unset token
          cat > "$RUNNER_TEMP/askpass.sh" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            Username*) echo x-access-token ;;
            *) cat "$VIBEFIX_TOKEN_FILE" ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass.sh"

      - name: Copy the commit
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SHA: ${{ inputs.sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$RUNNER_TEMP/askpass.sh" VIBEFIX_TOKEN_FILE="$RUNNER_TEMP/vibefix-token"
          repository="$RUNNER_TEMP/copy.git"
          git init --quiet --bare "$repository"
          git -C "$repository" config transfer.fsckObjects true
          git -C "$repository" -c credential.helper= fetch --quiet --no-tags \
            "$GITHUB_SERVER_URL/$SOURCE_REPOSITORY.git" "+refs/heads/$SOURCE_BRANCH:refs/heads/vibefix-source"
          git -C "$repository" cat-file -e "$SHA^{commit}"
          git -C "$repository" merge-base --is-ancestor "$SHA" refs/heads/vibefix-source
          git -C "$repository" -c credential.helper= push --quiet \
            "$GITHUB_SERVER_URL/$TARGET_REPOSITORY.git" "$SHA:refs/heads/$TARGET_BRANCH"
          head="$(git -C "$repository" -c credential.helper= ls-remote \
            "$GITHUB_SERVER_URL/$TARGET_REPOSITORY.git" "refs/heads/$TARGET_BRANCH" | cut -f1)"
          [ "$head" = "$SHA" ] || { echo "::error::$TARGET_REPOSITORY reads back another commit on $TARGET_BRANCH"; exit 1; }

      - name: Remove the credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vibefix-token" "$RUNNER_TEMP/askpass.sh" "$RUNNER_TEMP/oidc-header" \
            "$RUNNER_TEMP/exchange.json" "$RUNNER_TEMP/exchanged.json"
