# CI gates (spine: CI gates; NFR-2, SM-5, SG-33). Every push and pull request runs the build, every
# test suite with Modulith verification, the codebase secret scan and the OWASP ZAP baseline against
# a temporary Compose stack. Images are published to GHCR only from main, and only when every gate
# passed. Third-party actions and images are pinned by commit SHA or digest; the only credential is
# the workflow's own GITHUB_TOKEN, used by the publish job alone.
#
# Every week the same gates run on main with the images built without the layer cache, and the egress
# image is published again: its base is pinned by digest, but Squid comes from Ubuntu's security
# pocket at build time, so only a fresh build picks up its fixes (AD-26).
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Per event as well: a push to main must never leave the weekly run pending, where a later push
# would cancel it.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend build, tests, Modulith
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      # Full history: MigrationConventionsTest compares migrations with origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and run every test suite (unit, Modulith, integration on Testcontainers)
        run: ./mvnw -B verify
      # OpenApiExportIT rewrites frontend/src/api/openapi.json when it was stale; no build output may
      # be left untracked either.
      - name: Committed files are up to date
        run: test -z "$(git status --porcelain)" || { git status; git diff; exit 1; }

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose

  zap:
    name: Stack smoke test and OWASP ZAP baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create throwaway secret files
        run: bash deploy/dev-secrets.sh
      - name: Rebuild every image without the layer cache (weekly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: docker compose -f deploy/compose.yaml build --pull --no-cache
      - name: Start the stack
        run: docker compose -f deploy/compose.yaml up -d --build --wait --wait-timeout 600
      - name: Smoke test
        run: bash deploy/smoke.sh
      # Two baselines: the SPA from its root, and the API from an API response, which the SPA's
      # spider would never reach.
      - name: ZAP baseline
        run: |
          work="$RUNNER_TEMP/zap"
          mkdir -p "$work"
          cp deploy/zap/rules.tsv "$work/"
          # ZAP runs as uid 1000 and writes its working files next to the rules.
          chmod -R a+rwX "$work"
          zap=ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
          docker run --rm --network vibefix_edge -v "$work:/zap/wrk:rw" "$zap" \
            zap-baseline.py -t http://caddy -c rules.tsv -r zap-report.html
          docker run --rm --network vibefix_edge -v "$work:/zap/wrk:rw" "$zap" \
            zap-baseline.py -t http://caddy/api/v1/environment -c rules.tsv -r zap-api-report.html
      - name: ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: ${{ runner.temp }}/zap
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes --remove-orphans

  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (with shellcheck on every run block)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  publish:
    name: Publish images to GHCR
    needs: [backend, frontend, secrets, zap, workflow-lint]
    # A push to main publishes every image. The weekly run (or a manual one) on main publishes only
    # egress, rebuilt without the cache; the app and web images of a commit never change.
    if: >-
      github.ref == 'refs/heads/main'
      && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GHCR image names must be lowercase; the account name is not. A rebuilt egress image gets its
      # own tag, so the commit's tag keeps pointing at the image that commit first published.
      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "app=ghcr.io/$owner/vibefix-app:$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          echo "web=ghcr.io/$owner/vibefix-web:$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            echo "egress=ghcr.io/$owner/vibefix-egress:$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          else
            echo "egress=ghcr.io/$owner/vibefix-egress:$GITHUB_SHA-rebuild-$(date -u +%Y%m%d%H%M)" >>"$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: vibefix-app
        id: app
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.app }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: vibefix-web
        id: web
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/caddy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.names.outputs.web }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: vibefix-egress
        id: egress
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/egress
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: ${{ github.event_name != 'push' }}
          push: true
          tags: ${{ steps.names.outputs.egress }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      # Runs the published image on both architectures (arm64 through QEMU): the Squid package each
      # one carries, which a security notice can be checked against.
      - name: Squid in the published egress image
        id: squid
        env:
          EGRESS_IMAGE: ${{ steps.names.outputs.egress }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            version="$(docker run --rm --platform "$platform" --entrypoint dpkg-query \
              "${EGRESS_IMAGE%:*}@$EGRESS_DIGEST" -W squid | cut -f2)"
            echo "$platform: squid $version"
            echo "${platform#linux/}=$version" >>"$GITHUB_OUTPUT"
          done
      # AD-26: the host deploys by digest; the run's summary records which ones this run produced.
      - name: Record the published digests
        env:
          APP_IMAGE: ${{ steps.names.outputs.app }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WEB_IMAGE: ${{ steps.names.outputs.web }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          EGRESS_IMAGE: ${{ steps.names.outputs.egress }}
          EGRESS_DIGEST: ${{ steps.egress.outputs.digest }}
          SQUID_AMD64: ${{ steps.squid.outputs.amd64 }}
          SQUID_ARM64: ${{ steps.squid.outputs.arm64 }}
        run: |
          {
            echo "### Published images"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            if [[ -n $APP_DIGEST ]]; then
              echo "| \`$APP_IMAGE\` | \`$APP_DIGEST\` |"
              echo "| \`$WEB_IMAGE\` | \`$WEB_DIGEST\` |"
            fi
            echo "| \`$EGRESS_IMAGE\` | \`$EGRESS_DIGEST\` |"
            echo
            echo "Squid in egress: $SQUID_AMD64 (amd64), $SQUID_ARM64 (arm64)"
          } >>"$GITHUB_STEP_SUMMARY"
