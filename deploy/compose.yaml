# vibefix, local development stack: four services, each published on localhost only.
#
#   postgres  PostgreSQL 18                                  127.0.0.1:5432
#   backend   vibefix-app (Spring Boot, profile dev)         127.0.0.1:8080
#   frontend  Vite dev server on frontend/ (hot reload)      127.0.0.1:5173, /api proxied to backend
#   mailpit   catches every email the backend sends          127.0.0.1:8025 (web), 127.0.0.1:1025 (SMTP)
#
# Until the application works in this dev environment, the stack leaves out the production shape
# (Caddy edge, sandbox and checker workers, egress proxy; AD-26, AD-32) and CI runs no gates. Both
# are in git history at commit 4c64ceb; deferred-work.md says when to bring them back.
# Secrets are still files under deploy/secrets/ (AD-22): run deploy/dev-secrets.sh once.
#
#   bash deploy/dev-secrets.sh
#   docker compose -f deploy/compose.yaml up -d --build --wait
name: vibefix

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db-superuser-password
    secrets:
      - db-superuser-password
      - db-app-password
      - db-migrator-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Only the final server listens on TCP; the one that runs the init scripts does not.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres", "--dbname=vibefix"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    image: vibefix-app:local
    environment:
      TZ: UTC
      SPRING_PROFILES_ACTIVE: dev
      VIBEFIX_DB_HOST: postgres
      # No sandbox worker runs in this stack, so its health check would report DOWN.
      MANAGEMENT_HEALTH_SANDBOX_ENABLED: "false"
      # AD-27: email goes to Mailpit; nothing leaves the machine.
      VIBEFIX_EMAIL_SMTP_HOST: mailpit
      # AD-21: the files volume below.
      VIBEFIX_FILES_ROOT: /var/lib/vibefix/files
    secrets:
      - db-app-password
      - db-migrator-password
      # AD-22: the key that seals the kept Customer sign-in tokens.
      - identity-token-key-1
      # AD-19, AD-22: the key of the person-link signals.
      - identity-person-signal-key-1
      # AD-10: the dev sign-in OAuth App; empty files until it is registered (deploy/README.md).
      - github-oauth-client-id
      - github-oauth-client-secret
    volumes:
      # AD-21: stored files live on their own volume, never in PostgreSQL.
      - files:/var/lib/vibefix/files
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Email waits and retries while Mailpit is down, so the backend does not wait for it.
      mailpit:
        condition: service_started
    healthcheck:
      # Bash's /dev/tcp, because the JRE image has neither curl nor wget.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080
          && printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
      start_interval: 2s
    restart: unless-stopped

  frontend:
    image: node:24.22.0-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
    working_dir: /frontend
    init: true
    environment:
      TZ: UTC
      VIBEFIX_API_URL: http://backend:8080
      # Docker Desktop does not pass file change events from a Windows folder into the container.
      VIBEFIX_WATCH_POLLING: "true"
    # The sources are mounted from the host; node_modules lives in its own volume, because the
    # host's copy holds Windows binaries. npm ci runs only when package-lock.json has changed.
    command:
      - sh
      - -ec
      - |
        lock="$$(sha256sum package-lock.json)"
        if [ "$$(cat node_modules/.package-lock.sha256 2>/dev/null)" != "$$lock" ]; then
          npm ci --no-audit --no-fund
          echo "$$lock" >node_modules/.package-lock.sha256
        fi
        exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../frontend:/frontend
      - frontend-node-modules:/frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s
      start_interval: 3s
    restart: unless-stopped

  # The dev stand-in for the SMTP provider (Resend or Brevo in production, AD-27): it accepts every
  # message and shows it at http://127.0.0.1:8025. Messages live only as long as the container.
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped

volumes:
  pgdata: {}
  files: {}
  frontend-node-modules: {}

secrets:
  db-superuser-password:
    file: ./secrets/db-superuser-password
  db-app-password:
    file: ./secrets/db-app-password
  db-migrator-password:
    file: ./secrets/db-migrator-password
  identity-token-key-1:
    file: ./secrets/identity-token-key-1
  identity-person-signal-key-1:
    file: ./secrets/identity-person-signal-key-1
  github-oauth-client-id:
    file: ./secrets/github-oauth-client-id
  github-oauth-client-secret:
    file: ./secrets/github-oauth-client-secret
