# egress: the only way out for sandbox and checker (AD-26, AD-32). Both sit on internal networks with
# no route to the internet; this proxy is on those networks and on "outbound". It only opens HTTPS
# tunnels (CONNECT to port 443) and refuses everything else with 403. Each listener admits one
# client address, fixed in deploy/compose.yaml:
#
#   3128 sandbox  172.16.238.10  github.com, githubusercontent.com and their subdomains
#   3129 checker  172.16.239.10  any public host (preview liveness checks)

http_port 3128 name=sandbox
http_port 3129 name=checker

acl sandbox_port myportname sandbox
acl checker_port myportname checker
acl sandbox_client src 172.16.238.10/32
acl checker_client src 172.16.239.10/32

# CONNECT is a built-in ACL since Squid 5.
acl SSL_ports port 443
# ".github.com" matches github.com itself and every subdomain (api.github.com, codeload.github.com);
# ".githubusercontent.com" covers raw and object downloads. -n: match the requested name only,
# never a reverse lookup of an IP address.
acl github dstdomain -n .github.com .githubusercontent.com

# Addresses that are not on the public internet. Squid resolves the requested name itself, refuses
# the tunnel when any of its addresses is in this list, and then connects to the addresses it checked.
# IPv4-mapped IPv6 (::ffff:0:0/96) is left out on purpose: Squid stores every IPv4 address in that
# form, so listing it would match all of them.
acl non_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl non_public dst 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15
acl non_public dst 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl non_public dst ::/128 ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001:db8::/32 fc00::/7
acl non_public dst fe80::/10 ff00::/8

http_access deny !CONNECT
http_access deny !SSL_ports
http_access allow sandbox_port sandbox_client github
http_access deny sandbox_port
http_access deny checker_port !checker_client
http_access deny checker_port non_public
http_access allow checker_port
http_access deny all

# A tunnel proxy only: nothing is cached, and the client's address is not passed on. No ICMP pinger:
# it needs root, and nothing here measures network distance.
cache deny all
pinger_enable off
forwarded_for delete
httpd_suppress_version_string on
visible_hostname egress

# Logs go to the container's output, where Docker rotates them (AD-26). Squid runs in the foreground
# as the unprivileged proxy user, so the PID file lives in a directory that user owns.
access_log stdio:/dev/stdout squid
cache_log stdio:/dev/stderr
logfile_rotate 0
pid_filename /run/squid/squid.pid
coredump_dir /var/spool/squid
