# egress: the sandbox's only way out (AD-32). The sandbox sits on the internal network "jobs", which
# has no route to the internet; this proxy is on "jobs" and "outbound", and lets through only HTTPS
# tunnels (CONNECT to port 443) to GitHub. Everything else is refused with 403.

http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT
# ".github.com" matches github.com itself and every subdomain (api.github.com, codeload.github.com);
# ".githubusercontent.com" covers raw and object downloads. -n: match the requested name only,
# never a reverse lookup of an IP address.
acl github dstdomain -n .github.com .githubusercontent.com

http_access deny !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT github
http_access deny all

# A tunnel proxy only: nothing is cached, and the client's address is not passed on.
cache deny all
forwarded_for delete
httpd_suppress_version_string on
visible_hostname egress

# The image's entrypoint forwards these files to the container's output.
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
