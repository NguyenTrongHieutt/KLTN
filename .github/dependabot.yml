# Weekly update proposals for every pin: the backend's base images (by tag and digest), Compose
# images, Maven and npm. No CI runs for now (deploy/README.md), so build and test an update locally
# before taking it. The images parked in deploy/later/ and its workflow are not watched.
# Major versions are ignored: the architecture spine pins the stack's major versions (Java 25 LTS,
# Node 24 LTS, TypeScript 5.x and the rest), so a major upgrade is an architecture decision.
# Pull requests are not merged as-is; the author applies accepted updates in their own commits.
version: 2
updates:
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
